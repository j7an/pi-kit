version: 2
updates:
  # GitHub Actions (SHA-pinned, updated by Dependabot)
  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: "disabled"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "18:00"
      timezone: "America/Los_Angeles"
    groups:
      all-actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # Root devDependencies. Packages write `@pi-kit/shared` as `workspace:*`,
  # which Dependabot skips, and pin supplied peers to `*`, so neither moves.
  # Pi and pi-tui move together
  # in their own PR so a breaking Pi release cannot hold back the toolchain group;
  # the weekly pi-window CI job
  # covers the older Pi minors this pin moves past.
  # Rebasing stays on: both groups edit adjacent devDependencies lines, so
  # whichever merges second conflicts and must be rebased. A rebase that picks
  # up a version younger than minimum_release_age_days is held by the advisory
  # release-age check in dependency-safety.yml, which suppresses auto-merge.
  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "18:00"
      timezone: "America/Los_Angeles"
    groups:
      pi:
        patterns: ["@earendil-works/*"]
      dev-toolchain:
        patterns: ["*"]
        exclude-patterns: ["@earendil-works/*"]
    commit-message:
      prefix: "deps"
