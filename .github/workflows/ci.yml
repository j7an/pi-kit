name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm from packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" # zizmor: ignore[adhoc-packages] exact version from packageManager on an ephemeral runner

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Knip
        run: pnpm knip

      - name: Test
        run: pnpm test

  artifact:
    name: packed artifact (node ${{ matrix.node }}, pi ${{ matrix.pi }})
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    continue-on-error: ${{ matrix.pi == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: "22.19.0", pi: "0.85.1" }
          - { node: "24", pi: "0.85.1" }
          - { node: "24", pi: "latest" }
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm from packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" # zizmor: ignore[adhoc-packages] exact version from packageManager on an ephemeral runner

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack and record the exact tarball
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --filter @pi-kit/permissions pack --json --pack-destination "$RUNNER_TEMP/pack" > "$RUNNER_TEMP/pack/pack.json"

      - name: Validate the packed artifact with real Pi
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: sh scripts/assert-pack.sh "$RUNNER_TEMP/pack/pack.json"
