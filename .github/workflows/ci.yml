name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run against the Pi version window (shared-workflows release-window action).
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  # event_name keeps a push to main from cancelling the scheduled run on the same ref.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm from packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" # zizmor: ignore[adhoc-packages] exact version from packageManager on an ephemeral runner

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Knip
        run: pnpm knip

      - name: Test
        run: pnpm test

  artifact:
    name: packed artifact (node ${{ matrix.node }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm from packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" # zizmor: ignore[adhoc-packages] exact version from packageManager on an ephemeral runner

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack and record the exact tarball
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --filter @pi-kit/permissions pack --json --pack-destination "$RUNNER_TEMP/pack" > "$RUNNER_TEMP/pack/pack.json"

      - name: Validate the packed artifact with real Pi
        run: sh scripts/assert-pack.sh "$RUNNER_TEMP/pack/pack.json"

  pi-window:
    name: pi window
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.window.outputs.versions }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Compute the Pi version window
        id: window
        uses: j7an/shared-workflows/actions/release-window@f6fedd5f4a9e33ff83c893abcc608e402c1ee1b0 # v4.10.0
        with:
          npm-package: "@earendil-works/pi-coding-agent"
          window-days: "30"

  pi-compat:
    name: pi compat (pi ${{ matrix.pi }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: pi-window
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pi: ${{ fromJSON(needs.pi-window.outputs.versions) }}
    # ponytail: these steps repeat the artifact job's; extract a composite action if a third job needs them.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install pnpm from packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" # zizmor: ignore[adhoc-packages] exact version from packageManager on an ephemeral runner

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack and record the exact tarball
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --filter @pi-kit/permissions pack --json --pack-destination "$RUNNER_TEMP/pack" > "$RUNNER_TEMP/pack/pack.json"

      - name: Validate the packed artifact with real Pi
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: sh scripts/assert-pack.sh "$RUNNER_TEMP/pack/pack.json"
