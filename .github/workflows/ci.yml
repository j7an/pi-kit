name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run against the Pi version window (shared-workflows release-window action).
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  # event_name keeps a push to main from cancelling the scheduled run on the same ref.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm from packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" # zizmor: ignore[adhoc-packages] exact version from packageManager on an ephemeral runner

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Knip
        run: pnpm knip

      - name: Test
        run: pnpm test

  artifact:
    name: packed artifact (node ${{ matrix.node }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm from packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" # zizmor: ignore[adhoc-packages] exact version from packageManager on an ephemeral runner

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack and validate each package with real Pi
        run: |
          for dir in packages/*/; do
            name=$(node -p 'require("./" + process.argv[1]).name' "${dir}package.json")
            pack_dir="$RUNNER_TEMP/pack/$(basename "$dir")"
            mkdir -p "$pack_dir"
            pnpm --filter "$name" pack --json --pack-destination "$pack_dir" > "$pack_dir/pack.json"
          done
          shared_tarball=$(node -p 'require(process.argv[1]).filename' "$RUNNER_TEMP/pack/shared/pack.json")
          for dir in packages/*/; do
            pack_dir="$RUNNER_TEMP/pack/$(basename "$dir")"
            SHARED_TARBALL="$shared_tarball" sh scripts/assert-pack.sh "$pack_dir/pack.json"
          done

  # One run measures every package and gates it twice: Node enforces a total
  # line floor, and the shared action enforces changed-line coverage from the
  # same LCOV report.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: diff-cover needs the merge base with the PR base.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install pnpm from packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" # zizmor: ignore[adhoc-packages] exact version from packageManager on an ephemeral runner

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install diff-cover
        run: |
          python3 -m venv "$RUNNER_TEMP/diff-cover"
          "$RUNNER_TEMP/diff-cover/bin/python" -m pip install 'diff-cover>=10.2,<11'
          printf 'DIFF_COVER_PATH=%s\n' "$RUNNER_TEMP/diff-cover/bin/diff-cover" >> "$GITHUB_ENV"

      # The floor is a backstop for broken collection, not the regression gate:
      # tests overlap, so losing one test file moves the total about a point.
      # ponytail: Node omits modules no test loads, so deleting a module's only
      # importing test escapes both gates; require an LCOV record per in-scope
      # file if that ever happens.
      - name: Run tests with coverage
        run: >-
          pnpm test --experimental-test-coverage --test-coverage-lines=90
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info

      # A package's Pi factory (the default export) needs real Pi, so a PR that
      # changes only those lines fails; cover it with a stub `pi` if one does.
      - name: Check changed-line coverage
        uses: j7an/shared-workflows/actions/coverage@19391aa44c5b4f6247a38cf38c158fe692a44990 # v4.12.0
        with:
          report-path: lcov.info
          diff-cover-path: ${{ env.DIFF_COVER_PATH }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          minimum: "90"
          source-paths: |
            :(glob)packages/*/src/**
            :(glob)packages/*/extensions/**

  pi-window:
    name: pi window
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.window.outputs.versions }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Compute the Pi version window
        id: window
        uses: j7an/shared-workflows/actions/release-window@19391aa44c5b4f6247a38cf38c158fe692a44990 # v4.12.0
        with:
          npm-package: "@earendil-works/pi-coding-agent"
          window-days: "30"

  pi-compat:
    name: pi compat (pi ${{ matrix.pi }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: pi-window
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pi: ${{ fromJSON(needs.pi-window.outputs.versions) }}
    # ponytail: these steps repeat the artifact job's; extract a composite action if a third job needs them.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install pnpm from packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" # zizmor: ignore[adhoc-packages] exact version from packageManager on an ephemeral runner

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack and validate each package with real Pi
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: |
          for dir in packages/*/; do
            name=$(node -p 'require("./" + process.argv[1]).name' "${dir}package.json")
            pack_dir="$RUNNER_TEMP/pack/$(basename "$dir")"
            mkdir -p "$pack_dir"
            pnpm --filter "$name" pack --json --pack-destination "$pack_dir" > "$pack_dir/pack.json"
          done
          shared_tarball=$(node -p 'require(process.argv[1]).filename' "$RUNNER_TEMP/pack/shared/pack.json")
          for dir in packages/*/; do
            pack_dir="$RUNNER_TEMP/pack/$(basename "$dir")"
            SHARED_TARBALL="$shared_tarball" sh scripts/assert-pack.sh "$pack_dir/pack.json"
          done
