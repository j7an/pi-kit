name: Tag Release (permissions)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (auto = infer from Conventional Commits since last tag)"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions: {}

jobs:
  tag:
    permissions:
      contents: read
    uses: j7an/shared-workflows/.github/workflows/tag-release.yml@1084a4b6feef47a301967f12524f40be73295ea4 # v4.12.2
    with:
      bump: ${{ inputs.bump }}
      # Namespaced from the outset: each package gets its own tag stream and
      # its own bump config, so a release never touches another manifest.
      tag-prefix: "permissions/v"
      version-bump-config: ".version-bump.permissions.json"
      # Only this package's and shared's commits drive its bump. Shared's
      # release commit alone makes it releasable, so publishing shared can re-release it.
      paths: "packages/permissions packages/shared"
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
