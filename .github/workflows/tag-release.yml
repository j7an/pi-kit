name: Tag Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (auto = infer from Conventional Commits since last tag)"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions: {}

jobs:
  tag:
    permissions:
      contents: read
    uses: j7an/shared-workflows/.github/workflows/tag-release.yml@798e12564a8aeacc4dda95f76d8d3d22d677f1a0 # v4.9.0
    with:
      bump: ${{ inputs.bump }}
      # Namespaced from the outset: each package gets its own tag stream and
      # its own bump config, so a release never touches another manifest.
      tag-prefix: "permissions/v"
      version-bump-config: ".version-bump.permissions.json"
      # Only this package's commits drive its bump and the empty-release check.
      # No root files: the package ships src/ and extensions/ unbuilt, so root
      # config never changes the tarball.
      paths: "packages/permissions"
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
