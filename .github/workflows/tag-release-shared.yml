name: Tag Release (shared)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (auto = infer from Conventional Commits since last tag)"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions: {}

jobs:
  tag:
    permissions:
      contents: read
    uses: j7an/shared-workflows/.github/workflows/tag-release.yml@0cfe3ca15c18d38525bf950c029ada77805a9578 # v4.12.1
    with:
      bump: ${{ inputs.bump }}
      # Namespaced from the outset: each package gets its own tag stream and
      # its own bump config, so a release never touches another manifest.
      tag-prefix: "shared/v"
      version-bump-config: ".version-bump.shared.json"
      # Only shared's commits drive its bump and the empty-release check.
      paths: "packages/shared"
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
